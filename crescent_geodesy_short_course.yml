summary: >
  The CRESCENT Strain Accumulation and Release from GNSS technical short course introduced graduate students, postdocs, and professionals to using geodetic observations to understand the earthquake cycle in the Cascadia Subduction Zone. Over three days, participants progressed from processing GNSS time series and identifying interseismic, coseismic, and slow-slip signals to estimating fault slip and plate coupling, and exploring how viscoelastic processes influence surface deformation.
description: >
  The Strain Accumulation and Release from GNSS collection provides open-source educational resources and computational tools for exploring earthquake-cycle processes through geodetic observations. The materials were developed and presented by instructors from CRESCENT's Coupling, Seismicity, and Slow Slip (C3S) Working Group as part of CRESCENT's Geoscience Education and Inclusion (GEI) Technical Short Course program. They introduce methods for processing GNSS time-series data, identifying signals associated with interseismic strain accumulation, coseismic deformation, and slow-slip events, and using geodetic observations to investigate fault slip and plate coupling in subduction zones.
  The collection includes Python-based Jupyter notebooks, instructional materials, and hands-on exercises that guide users through geodetic data processing, forward modeling, and inverse methods. Users can explore different Earth models, compare predicted surface deformation, and investigate how elastic and viscoelastic properties influence interpretations of fault slip and earthquake-cycle behavior. These resources are intended to support students, researchers, and professionals working in geodesy, tectonics, and earthquake science, while providing adaptable examples that can be incorporated into research, teaching, and professional development. 
